<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEÓN PURGA — Battle Royale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
:root{
  --void:#04040c;--deep:#0a0a1a;--panel:#0f1028;--panel2:#161838;
  --neon-p:#ff2d95;--neon-c:#00f0ff;--neon-g:#39ff14;--neon-y:#ffe600;
  --text:#e0e8ff;--muted:#6a7a9a;--danger:#ff1744;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);color:var(--text);font-family:'Rajdhani',sans-serif;overflow:hidden;height:100%}
#app{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,var(--void) 60%)}

/* Animated bg grid */
#app::before{content:'';position:fixed;inset:0;background:
  linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);
  background-size:40px 40px;animation:gridMove 20s linear infinite;pointer-events:none}
@keyframes gridMove{to{background-position:0 40px}}

#gameStage{position:relative;z-index:5;border:2px solid #00f0ff33;border-radius:8px;box-shadow:0 0 80px #ff2d9522,0 0 120px #00f0ff11,inset 0 0 60px #0008}
canvas{display:block;image-rendering:pixelated;border-radius:6px;cursor:crosshair}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:radial-gradient(ellipse at 50% 20%,#1a1040ee 0%,#04040cee 80%);transition:opacity .25s}
.screen.hidden{display:none!important}
.logo{font-family:'Orbitron',sans-serif;font-size:clamp(40px,7vw,72px);font-weight:900;letter-spacing:6px;
  background:linear-gradient(135deg,var(--neon-p),var(--neon-c),var(--neon-g));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 20px #ff2d9566);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 20px #ff2d9566)}50%{filter:drop-shadow(0 0 40px #00f0ff88)}}
.sub{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--neon-c);letter-spacing:4px;margin:8px 0 32px;text-transform:uppercase}
.btn{font-family:'Orbitron',sans-serif;background:transparent;border:2px solid var(--neon-c);color:var(--neon-c);
  padding:14px 32px;font-size:14px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.btn:hover{background:var(--neon-c);color:var(--void);box-shadow:0 0 30px #00f0ff66}
.btn.primary{border-color:var(--neon-p);color:var(--neon-p)}
.btn.primary:hover{background:var(--neon-p);color:var(--void);box-shadow:0 0 30px #ff2d9566}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.lobby-wrap{max-width:920px;width:95%;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media(max-width:720px){.lobby-wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid #00f0ff22;padding:20px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.panel h3{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--neon-c);letter-spacing:2px;margin-bottom:14px}
input,select{width:100%;background:#0008;border:1px solid #00f0ff33;color:var(--text);padding:10px;font-family:'Rajdhani',sans-serif;font-size:15px;margin-bottom:10px}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccard{background:#0006;border:2px solid #ffffff12;padding:12px;cursor:pointer;transition:.15s}
.ccard:hover{border-color:#00f0ff55}
.ccard.on{border-color:var(--neon-p);background:#ff2d9510;box-shadow:0 0 20px #ff2d9522}
.ccard .ic{font-size:26px}.ccard .nm{font-weight:700;font-size:14px;margin-top:4px}.ccard .ds{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.map-row{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{flex:1;min-width:80px;padding:10px 6px;text-align:center;border:2px solid #ffffff15;cursor:pointer;font-size:12px;background:#0005}
.mbtn.on{border-color:var(--neon-c);background:#00f0ff10;color:var(--neon-c)}
.mbtn b{display:block;font-size:13px;margin-bottom:2px}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10;font-variant-numeric:tabular-nums}
#hud *{pointer-events:none}
.bar-wrap{position:absolute;left:14px;bottom:14px;width:220px}
.bl{font-size:9px;font-family:'Orbitron',sans-serif;color:var(--muted);letter-spacing:1px;margin-bottom:2px}
.bar{width:100%;height:10px;background:#000a;border:1px solid #00f0ff33;margin-bottom:5px;overflow:hidden}
.fill{height:100%;transition:width .1s}
#hpF{background:linear-gradient(90deg,var(--neon-g),#00ff8844)}
#stF{background:linear-gradient(90deg,var(--neon-c),#0088ff)}

#minimap{position:absolute;top:14px;left:14px;border:2px solid #00f0ff44;background:#000c;border-radius:4px}
#topHud{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.tag{font-family:'Orbitron',sans-serif;font-size:10px;background:#000b;border:1px solid #00f0ff33;padding:4px 12px;letter-spacing:1px}
.tag b{color:var(--neon-p)}

#weaponHud{position:absolute;right:14px;bottom:14px;background:#000d;border:1px solid #ff2d9544;padding:10px 16px;text-align:right;min-width:170px}
#wName{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--neon-p);font-weight:700}
#wAmmo{font-size:13px;color:var(--muted)}
#wTier{font-size:9px;color:var(--neon-y);letter-spacing:2px;font-family:'Orbitron',sans-serif}

#abs{position:absolute;right:14px;bottom:88px;display:flex;gap:5px}
.ab{width:46px;height:46px;background:#000b;border:2px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.ab.ok{border-color:var(--neon-g);box-shadow:0 0 10px #39ff1444}
.ab .k{position:absolute;top:1px;left:3px;font-size:8px;font-family:'Orbitron',sans-serif;color:var(--muted)}
.ab .cd{position:absolute;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:13px;color:var(--danger)}

#slots{position:absolute;right:14px;bottom:144px;display:flex;gap:4px}
.sl{width:36px;height:36px;background:#0009;border:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:11px;color:var(--muted)}
.sl.on{border-color:var(--neon-p);color:var(--neon-p);box-shadow:0 0 8px #ff2d9544}

#feed{position:absolute;top:14px;right:14px;max-width:260px;text-align:right;font-size:12px}
#feed div{margin-bottom:3px;padding:4px 10px;background:#000b;border-left:2px solid var(--neon-p);animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

#hint{position:absolute;top:58%;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:11px;
  color:var(--neon-g);background:#000d;border:1px solid #39ff1444;padding:6px 16px;letter-spacing:1px;display:none}
#streak{position:absolute;top:40%;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
  color:var(--neon-y);text-shadow:0 0 20px #ffe600;display:none;animation:streakPop .8s}
@keyframes streakPop{0%{transform:translateX(-50%) scale(2);opacity:0}30%{opacity:1}100%{transform:translateX(-50%) scale(1);opacity:0}}

#crosshair{position:absolute;width:20px;height:20px;pointer-events:none;transform:translate(-50%,-50%)}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:var(--neon-c);box-shadow:0 0 6px var(--neon-c)}
#crosshair::before{width:2px;height:12px;top:4px;left:9px}
#crosshair::after{width:12px;height:2px;top:9px;left:4px}

#dmgLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dn{position:absolute;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--neon-p);text-shadow:0 0 8px #ff2d95;animation:floatUp .7s forwards}
.dn.cr{font-size:16px;color:var(--neon-y)}
@keyframes floatUp{to{opacity:0;transform:translateY(-35px)}}

#countdown{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:60;font-family:'Orbitron',sans-serif;font-size:100px;font-weight:900;color:var(--neon-c);text-shadow:0 0 40px var(--neon-c)}
.hidden{display:none!important}

.stats-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;max-width:480px;width:90%}
.sb{background:var(--panel);border:1px solid #00f0ff22;padding:16px;text-align:center}
.sb .v{font-family:'Orbitron',sans-serif;font-size:32px;color:var(--neon-g)}.sb .l{font-size:11px;color:var(--muted);margin-top:4px}
#menuCanvas{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.4}
</style>
</head>
<body>
<canvas id="menuCanvas"></canvas>
<div id="app">
  <div id="gameStage">
    <canvas id="c" width="960" height="600"></canvas>
    <div id="hud" class="hidden">
      <canvas id="minimap" width="130" height="130"></canvas>
      <div id="crosshair"></div>
      <div id="topHud">
        <div class="tag">TORMENTA <b id="zoneT">--</b>s</div>
        <div class="tag">SUPERVIVIENTES <b id="aliveT">--</b></div>
        <div class="tag"><b id="timeT">0:00</b></div>
      </div>
      <div class="bar-wrap">
        <div class="bl">INTEGRIDAD</div><div class="bar"><div class="fill" id="hpF" style="width:100%"></div></div>
        <div class="bl">ENERGÍA</div><div class="bar"><div class="fill" id="stF" style="width:100%"></div></div>
      </div>
      <div id="feed"></div>
      <div id="hint">[E] RECOGER SUMINISTRO</div>
      <div id="streak"></div>
      <div id="slots"></div>
      <div id="abs">
        <div class="ab" id="abQ"><span class="k">Q</span>⚡<div class="cd hidden" id="cdQ"></div></div>
        <div class="ab" id="abF"><span class="k">F</span>💨<div class="cd hidden" id="cdF"></div></div>
        <div class="ab" id="abG"><span class="k">G</span>💣<div class="cd hidden" id="cdG"></div></div>
      </div>
      <div id="weaponHud">
        <div id="wTier"></div>
        <div id="wName">PISTOLA NEÓN</div>
        <div id="wAmmo">18 / 18</div>
      </div>
      <div id="dmgLayer"></div>
    </div>
  </div>

  <div id="mainMenu" class="screen">
    <div class="logo">NEÓN PURGA</div>
    <p class="sub">Protocolo de eliminación · Sector toxico</p>
    <div class="btn-row">
      <button class="btn primary" id="bQuick">Despliegue rápido</button>
      <button class="btn" id="bLobby">Configurar</button>
      <button class="btn" id="bRank">Ranking</button>
    </div>
  </div>

  <div id="lobby" class="screen hidden">
    <div class="logo" style="font-size:28px">CONFIGURACIÓN</div>
    <div class="lobby-wrap">
      <div class="panel">
        <h3>◈ OPERATIVO</h3>
        <input id="pName" maxlength="16" value="Neon-7" placeholder="Código operativo">
        <div class="class-grid" id="classGrid"></div>
      </div>
      <div class="panel">
        <h3>◈ SECTOR</h3>
        <div class="map-row" id="mapGrid"></div>
        <div style="display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;color:var(--muted)">
          Hostiles <input type="range" id="botR" min="3" max="14" value="8" style="flex:1;margin:0"> <span id="botN">8</span>
        </div>
        <select id="diff"><option value="easy">Amenaza: Baja</option><option value="normal" selected>Amenaza: Media</option><option value="hard">Amenaza: Alta</option><option value="nightmare">Amenaza: Extrema</option></select>
        <select id="mode"><option value="classic">Protocolo: Estándar</option><option value="blitz">Protocolo: Blitz</option><option value="hardcore">Protocolo: Supervivencia</option></select>
      </div>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn primary" id="bStart">INICIAR PURGA</button>
      <button class="btn" id="bBack">← VOLVER</button>
    </div>
  </div>

  <div id="rankScreen" class="screen hidden">
    <div class="logo" style="font-size:24px">RANKING</div>
    <div id="rankList" style="margin:16px 0;font-size:14px;line-height:2;min-width:300px"></div>
    <button class="btn" id="bBackRank">← VOLVER</button>
  </div>

  <div id="pauseScr" class="screen hidden">
    <div class="logo" style="font-size:32px">PAUSA</div>
    <div class="btn-row"><button class="btn primary" id="bResume">CONTINUAR</button><button class="btn" id="bQuit">ABANDONAR</button></div>
  </div>

  <div id="resultScr" class="screen hidden">
    <div class="logo" id="resTitle" style="font-size:32px">RESULTADO</div>
    <p class="sub" id="resSub"></p>
    <div class="stats-g">
      <div class="sb"><div class="v" id="rK">0</div><div class="l">Eliminaciones</div></div>
      <div class="sb"><div class="v" id="rD">0</div><div class="l">Daño</div></div>
      <div class="sb"><div class="v" id="rT">0:00</div><div class="l">Tiempo</div></div>
    </div>
    <div class="btn-row"><button class="btn primary" id="bAgain">OTRA PARTIDA</button><button class="btn" id="bMenu">MENÚ</button></div>
  </div>

  <div id="countdown" class="hidden"></div>
</div>

<script>
(function(){
"use strict";

const VIEW={w:960,h:600};
const MAPS={
  toxico:  {name:"Sector Tóxico",w:2400,h:1800,zR:1150,obs:26,chests:20,bg:"#0a0818",grid:"#ff2d9508",accent:"#ff2d95"},
  ciudad:  {name:"Ciudad Fantasma",w:2000,h:1600,zR:880,obs:40,chests:24,bg:"#080818",grid:"#00f0ff0a",accent:"#00f0ff"},
  reactor: {name:"Planta Reactor",w:2600,h:1900,zR:1200,obs:18,chests:16,bg:"#100808",grid:"#39ff1408",accent:"#39ff14"}
};
const CLASSES={
  striker: {name:"Striker",icon:"⚔",desc:"+25% daño de arma. Q: Sobrecarga (doble fuego 5s)",hp:100,dmg:1.25,spd:1,regen:0,ab:"overload",cd:13},
  medic:   {name:"Medic",icon:"✚",desc:"Regenera 3 HP/s. Q: Campo de reparación (+50 HP)",hp:115,dmg:1,spd:1,regen:3,ab:"repair",cd:11},
  ghost:   {name:"Ghost",icon:"◎",desc:"+35% velocidad. Q: Fase fantasma (invisible 6s)",hp:85,dmg:1,spd:1.35,regen:0,ab:"phase",cd:15},
  tech:    {name:"Tech",icon:"⬡",desc:"Granadas +1. Q: Dron de combate (12s)",hp:100,dmg:1,spd:.95,regen:0,ab:"drone",cd:17}
};
const WEAPONS={
  fists:  {name:"Puños cromados",tier:"",dmg:8,rate:.4,spd:0,range:52,ammo:Infinity,melee:1,color:"#aaa",slot:1},
  pistol: {name:"Pistola Neón",tier:"COMÚN",dmg:14,rate:.22,spd:700,range:900,ammo:20,spread:.02,color:"#00f0ff",slot:2},
  smg:    {name:"SMG Plasma",tier:"COMÚN",dmg:9,rate:.07,spd:750,range:650,ammo:40,spread:.05,color:"#ff2d95",slot:2},
  shotgun:{name:"Riot Shotgun",tier:"RARO",dmg:11,rate:.75,spd:600,range:400,ammo:8,spread:.18,pellets:8,color:"#ffe600",slot:3},
  rifle:  {name:"Rifle Pulso",tier:"RARO",dmg:18,rate:.11,spd:950,range:1200,ammo:32,spread:.035,color:"#39ff14",slot:3},
  sniper: {name:"Railgun",tier:"ÉPICO",dmg:62,rate:1.0,spd:1400,range:1800,ammo:4,spread:.005,color:"#b388ff",slot:4,pierce:1},
  lmg:    {name:"Ametr. Voltaica",tier:"ÉPICO",dmg:15,rate:.08,spd:850,range:950,ammo:70,spread:.07,color:"#ff6a3d",slot:4},
  rocket: {name:"Devastador",tier:"LEGENDARIO",dmg:50,rate:1.3,spd:500,range:750,ammo:3,spread:0,color:"#ff1744",slot:5,explosive:1,blast:100}
};
const DIFF={easy:{hp:.65,dmg:.55,acc:.07,spd:.8},normal:{hp:1,dmg:1,acc:.05,spd:1},hard:{hp:1.35,dmg:1.25,acc:.035,spd:1.2},nightmare:{hp:1.7,dmg:1.5,acc:.02,spd:1.35}};

const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const mmC=document.getElementById('minimap'), mmX=mmC.getContext('2d');
const stage=document.getElementById('gameStage');

let keys={}, mouse={x:VIEW.w/2,y:VIEW.h/2,down:0}, running=0, paused=0, gameOver=0, elapsed=0, lastT=0;
let WORLD={w:2400,h:1800}, cfg={name:"Neon-7",cls:"striker",map:"toxico",bots:8,diff:"normal",mode:"classic"};
let zone,player,bots=[],obs=[],walls=[],chests=[],bullets=[],parts=[],grenades=[],drones=[],drops=[];
let feed=[],stats={k:0,dmg:0},audioCtx,killStreak=0,streakTimer=0,wallCd=0;
let muzzleFlash=0, dropAnim=0;

function R(a,b){return a+Math.random()*(b-a)}
function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function C(v,a,b){return Math.max(a,Math.min(b,v))}

// ── AUDIO ──
function sfx(type){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const t=audioCtx.currentTime;
    if(type==='shoot'){o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(80,t+.06);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.start(t);o.stop(t+.07)}
    else if(type==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(150,t);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.08)}
    else if(type==='pick'){o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.setValueAtTime(780,t+.06);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.12)}
    else if(type==='boom'){o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(15,t+.35);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}
    else if(type==='win'){[440,554,659,880].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.12));g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.start(t);o.stop(t+.55)}
  }catch(e){}
}

// ── INPUT (fixed: stage-level events) ──
function updateMouse(e){
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(VIEW.w/r.width);
  mouse.y=(e.clientY-r.top)*(VIEW.h/r.height);
  const cx=stage.getBoundingClientRect();
  document.getElementById('crosshair').style.left=(e.clientX-cx.left)+'px';
  document.getElementById('crosshair').style.top=(e.clientY-cx.top)+'px';
}
stage.addEventListener('mousemove',updateMouse);
stage.addEventListener('mousedown',e=>{
  initAudio();
  if(e.button===0) mouse.down=1;
  else if(e.button===2&&cfg.cls==='tech') placeWall();
  e.preventDefault();
});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.down=0});
stage.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=1;
  if(e.key==='Escape'&&running&&!gameOver){paused=!paused;showUI(paused?'pause':'game');if(!paused)lastT=performance.now();e.preventDefault();return}
  if(!running||paused||gameOver) return;
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='5'){const s=+k;if(s===1&&player.weapons.fists)equip('fists');else{const w=Object.keys(WEAPONS).find(x=>player.weapons[x]&&WEAPONS[x].slot===s);if(w)equip(w)}}
  if(k==='r') reload();
  if(k==='e') pickup();
  if(k==='q') ability();
  if(k==='f') dash();
  if(k==='g') throwGren();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});

function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||webkitAudioContext)()}catch(e){}}

// ── UI ──
function showUI(s){
  ['mainMenu','lobby','rankScreen','pauseScr','resultScr'].forEach(id=>{
    document.getElementById(id).classList.toggle('hidden',!(s==='menu'&&id==='mainMenu'||s==='lobby'&&id==='lobby'||s==='rank'&&id==='rankScreen'||s==='pause'&&id==='pauseScr'||s==='results'&&id==='resultScr'));
  });
  document.getElementById('hud').classList.toggle('hidden',s!=='game'&&s!=='pause');
  document.getElementById('menuCanvas').style.display=(s==='menu'||s==='lobby')?'block':'none';
}

function buildLobby(){
  document.getElementById('classGrid').innerHTML=Object.entries(CLASSES).map(([id,c])=>
    `<div class="ccard${id===cfg.cls?' on':''}" data-c="${id}"><div class="ic">${c.icon}</div><div class="nm">${c.name}</div><div class="ds">${c.desc}</div></div>`).join('');
  document.querySelectorAll('.ccard').forEach(el=>el.onclick=()=>{cfg.cls=el.dataset.c;buildLobby()});
  document.getElementById('mapGrid').innerHTML=Object.entries(MAPS).map(([id,m])=>
    `<div class="mbtn${id===cfg.map?' on':''}" data-m="${id}"><b>${m.name}</b>${m.w}×${m.h}</div>`).join('');
  document.querySelectorAll('.mbtn').forEach(el=>el.onclick=()=>{cfg.map=el.dataset.m;buildLobby()});
  document.getElementById('botR').oninput=e=>{cfg.bots=+e.target.value;document.getElementById('botN').textContent=cfg.bots};
}

function msg(t){feed.unshift(t);if(feed.length>7)feed.pop();document.getElementById('feed').innerHTML=feed.map(m=>`<div>${m}</div>`).join('')}

function showDmg(x,y,d,crit){
  const s=w2s(x,y),app=document.getElementById('app').getBoundingClientRect(),st=stage.getBoundingClientRect();
  const el=document.createElement('div');el.className='dn'+(crit?' cr':'');el.textContent=Math.round(d);
  el.style.left=(st.left-app.left+s.x)+'px';el.style.top=(st.top-app.top+s.y)+'px';
  document.getElementById('dmgLayer').appendChild(el);setTimeout(()=>el.remove(),700);
}

// ── PLAYER ──
function mkPlayer(){
  const c=CLASSES[cfg.cls];
  let hp=c.hp; if(cfg.mode==='hardcore')hp=Math.floor(hp*.55);
  return{
    x:WORLD.w/2,y:WORLD.h/2,r:17,hp,maxHp:hp,stam:100,maxStam:100,
    spd:195*c.spd,cls:cfg.cls,facing:0,
    weapons:{fists:1,pistol:1}, ammo:{pistol:20},
    weapon:'pistol', fireT:0, reload:0, reloadT:0,
    alive:1, isPlayer:1, flash:0, shake:0,
    abCd:0, dashCd:0, grenades:cfg.cls==='tech'?3:2,
    boost:0, shield:0, phase:0, overload:0,
    dash:0, dashT:0, dashV:{x:0,y:0},
    xp:0, lvl:1
  };
}

function mkBot(i){
  let x,y;do{x=R(120,WORLD.w-120);y=R(120,WORLD.h-120)}while(D({x,y},player)<400);
  const d=DIFF[cfg.diff], ws=['pistol','smg','shotgun','rifle'];
  const names=['Vortex','Cipher','Razor','Null','Hex','Pulse','Zero','Flux','Onyx','Blade','Nova','Specter'];
  return{x,y,r:16,hp:Math.floor(75*d.hp),maxHp:Math.floor(75*d.hp),spd:135*d.spd,alive:1,
    weapon:ws[i%ws.length],fireT:R(0,.8),state:'roam',roam:{x:R(100,WORLD.w-100),y:R(100,WORLD.h-100)},
    flash:0,name:names[i%names.length]+'-'+Math.floor(R(10,99)),aim:0,acc:d.acc,dmgM:d.dmg};
}

function resetWorld(){
  const m=MAPS[cfg.map]; WORLD={w:m.w,h:m.h};
  const zInt=cfg.mode==='blitz'?11:18;
  zone={cx:WORLD.w/2,cy:WORLD.h/2,r:m.zR,tR:m.zR,next:zInt,shrink:0,shT:0};
  obs=[];walls=[];chests=[];bullets=[];parts=[];grenades=[];drones=[];drops=[];
  bots=[];feed=[];elapsed=0;gameOver=0;paused=0;stats={k:0,dmg:0};killStreak=0;dropAnim=1.5;
  player=mkPlayer();
  player.x=R(WORLD.w*.35,WORLD.w*.65);player.y=R(WORLD.h*.35,WORLD.h*.65);
  for(let i=0;i<m.obs;i++) obs.push({x:R(80,WORLD.w-80),y:R(80,WORLD.h-80),r:R(20,48),t:['rock','tree','ruin','crate'][Math.floor(R(0,4))]});
  if(cfg.map==='ciudad') for(let i=0;i<10;i++) walls.push({x:R(150,WORLD.w-150),y:R(150,WORLD.h-150),ang:Math.floor(R(0,4))*Math.PI/2,len:R(70,130),thick:16,hp:250,maxHp:250,static:1});
  for(let i=0;i<m.chests;i++) chests.push(mkChest());
  for(let i=0;i<cfg.bots;i++) bots.push(mkBot(i));
  buildSlots();
  msg('◈ Despliegue en '+m.name+' — Click para disparar');
}

function mkChest(){
  const loot=[
    {t:'w',id:'pistol',w:3},{t:'w',id:'smg',w:3},{t:'w',id:'shotgun',w:2},{t:'w',id:'rifle',w:2},
    {t:'w',id:'sniper',w:1},{t:'w',id:'lmg',w:1},{t:'w',id:'rocket',w:.4},
    {t:'a',id:'pistol',n:20,w:2},{t:'a',id:'smg',n:30,w:2},{t:'a',id:'shotgun',n:8,w:2},{t:'a',id:'rifle',n:28,w:2},
    {t:'h',n:40,w:3},{t:'h',n:70,w:1.5},{t:'s',d:10,w:2},{t:'sh',d:12,w:1.5},{t:'g',n:2,w:2}
  ];
  let tot=loot.reduce((s,l)=>s+l.w,0),r=Math.random()*tot,l=loot[0];
  for(const x of loot){r-=x.w;if(r<=0){l=x;break}}
  const tier=l.t==='w'?WEAPONS[l.id].tier:'';
  return{x:R(100,WORLD.w-100),y:R(100,WORLD.h-100),open:0,loot:l,tier,r:R(0,6.28),beam:0};
}

// ── ACTIONS ──
function equip(w){if(player.weapons[w])player.weapon=w}
function reload(){const w=player.weapon;if(WEAPONS[w].melee||player.reload)return;if((player.ammo[w]||0)>=WEAPONS[w].ammo)return;player.reload=1;player.reloadT=1.1}
function dash(){if(player.dashCd>0||player.dash||player.stam<18)return;player.dash=1;player.dashT=.2;player.dashV={x:Math.cos(player.facing)*580,y:Math.sin(player.facing)*580};player.dashCd=2.2;player.stam=Math.max(0,player.stam-22);burst(player.x,player.y,10,'#00f0ff')}
function throwGren(){if(player.grenades<=0)return;player.grenades--;grenades.push({x:player.x,y:player.y,vx:Math.cos(player.facing)*350,vy:Math.sin(player.facing)*350,t:2,owner:'p'})}
function placeWall(){if(wallCd>0)return;const a=player.facing;walls.push({x:player.x+Math.cos(a)*55,y:player.y+Math.sin(a)*55,ang:a,len:85,thick:15,hp:150,maxHp:150});if(walls.length>7)walls.shift();wallCd=2}

function ability(){
  if(player.abCd>0)return;
  const c=CLASSES[cfg.cls]; player.abCd=c.cd;
  if(c.ab==='overload'){player.overload=elapsed+5;msg('⚡ SOBRECARGA');burst(player.x,player.y,15,'#ff2d95')}
  else if(c.ab==='repair'){player.hp=Math.min(player.maxHp,player.hp+50);burst(player.x,player.y,20,'#39ff14',1);msg('✚ CAMPO DE REPARACIÓN')}
  else if(c.ab==='phase'){player.phase=elapsed+6;burst(player.x,player.y,25,'#888',1);msg('◎ FASE FANTASMA')}
  else if(c.ab==='drone'){drones.push({x:player.x,y:player.y-30,hp:80,life:12,fireT:0});msg('⬡ DRON DESPLEGADO')}
}

function pickup(){
  for(const c of chests) if(!c.open&&D(c,player)<50){openLoot(c);return}
  for(const d of drops) if(d.landed&&!d.open&&D(d,player)<50){openLoot(d);d.open=1;return}
}

function openLoot(c){
  c.open=1; const l=c.loot; sfx('pick');
  if(l.t==='w'){player.weapons[l.id]=1;player.ammo[l.id]=Math.floor(WEAPONS[l.id].ammo*.75);equip(l.id);msg('◈ '+WEAPONS[l.id].name+' adquirido')}
  else if(l.t==='a'){player.ammo[l.id]=(player.ammo[l.id]||0)+l.n;msg('◈ Munición +'+l.n)}
  else if(l.t==='h'){player.hp=Math.min(player.maxHp,player.hp+l.n);msg('◈ Reparación +'+l.n)}
  else if(l.t==='s'){player.boost=elapsed+l.d;msg('◈ Impulso de velocidad')}
  else if(l.t==='sh'){player.shield=elapsed+l.d;msg('◈ Escudo de energía')}
  else if(l.t==='g'){player.grenades=Math.min(6,player.grenades+l.n);msg('◈ Granadas +'+l.n)}
  buildSlots();
}

function buildSlots(){
  document.getElementById('slots').innerHTML=[1,2,3,4,5].map(s=>{
    const w=s===1?'fists':Object.keys(WEAPONS).find(k=>player.weapons[k]&&WEAPONS[k].slot===s);
    const on=w&&player.weapon===w, has=s===1||!!w;
    return`<div class="sl${on?' on':''}" style="opacity:${has?1:.25}">${s}</div>`;
  }).join('');
}

// ── COMBAT ──
function fire(sh,isP){
  const wk=isP?player.weapon:sh.weapon, wd=WEAPONS[wk];
  let ang;
  if(isP){const wm=s2w(mouse.x,mouse.y);ang=Math.atan2(wm.y-sh.y,wm.x-sh.x);player.facing=ang}
  else ang=sh.aim;

  if(wd.melee){
    const tgts=isP?bots.filter(b=>b.alive):[player];
    for(const t of tgts){const a2=Math.atan2(t.y-sh.y,t.x-sh.x);let df=Math.abs(a2-ang);if(df>Math.PI)df=2*Math.PI-df;if(D(sh,t)<wd.range&&df<.7)hit(t,wd.dmg*(isP?CLASSES[cfg.cls].dmg:1),isP)}
    return;
  }
  if(isP){
    if((player.ammo[wk]||0)<=0||player.reload) return;
    player.ammo[wk]--;
    muzzleFlash=.06;
  }
  sfx('shoot');
  const n=wd.pellets||1;
  for(let i=0;i<n;i++){
    const sp=(Math.random()-.5)*(wd.spread||0)*2, a=ang+sp;
    bullets.push({x:sh.x+Math.cos(a)*sh.r,y:sh.y+Math.sin(a)*sh.r,dx:Math.cos(a)*wd.spd,dy:Math.sin(a)*wd.spd,
      dmg:wd.dmg*(isP?CLASSES[cfg.cls].dmg*(elapsed<player.overload?1.5:1):sh.dmgM||1),
      life:wd.range/wd.spd,owner:isP?'p':'b',color:wd.color,exp:wd.explosive,blast:wd.blast||0,pierce:wd.pierce||0,trail:[]});
  }
}

function hit(ent,dmg,byP){
  if(ent.isPlayer&&elapsed<ent.shield)dmg*=.25;
  if(ent.isPlayer&&elapsed<ent.phase&&!byP)return;
  ent.hp-=dmg; ent.flash=.12;
  if(byP){stats.dmg+=dmg;showDmg(ent.x,ent.y,dmg,dmg>40);sfx('hit')}
  if(ent.isPlayer)player.shake=.18;
  burst(ent.x,ent.y,4,'#ff2d95');
  if(ent.hp<=0&&ent.alive){
    ent.alive=0;
    if(ent.isPlayer) endGame(0);
    else{
      stats.k++; killStreak++; streakTimer=2;
      const labels=['','DOBLE','TRIPLE','CUÁDRUPLE','DOMINACIÓN'];
      if(killStreak>=2&&killStreak<=4){const el=document.getElementById('streak');el.textContent=labels[killStreak]+' ELIMINACIÓN';el.style.display='block';setTimeout(()=>el.style.display='none',800)}
      msg('💀 '+ent.name+' eliminado'); burst(ent.x,ent.y,20,'#ff2d95',1);
    }
  }
}

function boom(x,y,r,dmg,owner){
  sfx('boom'); burst(x,y,30,'#ff1744',1); player.shake=.3;
  if(owner==='p'||owner==='drone') for(const b of bots) if(b.alive&&D({x,y},b)<r) hit(b,dmg*(1-D({x,y},b)/r),1);
  if(D({x,y},player)<r&&player.alive) hit(player,dmg*(1-D({x,y},player)/r)*.6,0);
  for(const w of walls) if(D({x,y},w)<r) w.hp-=50;
}

function burst(x,y,n,col,ring){
  for(let i=0;i<n;i++){const a=ring?(i/n)*Math.PI*2:Math.random()*Math.PI*2,s=ring?R(40,120):R(-100,100);
    parts.push({x,y,dx:Math.cos(a)*s,dy:Math.sin(a)*s,life:R(.2,.6),col,sz:R(2,6)})}
}

// ── PHYSICS ──
function blocked(x,y,r){
  for(const o of obs) if(D({x,y},o)<r+o.r) return 1;
  for(const w of walls) if(wallHit(x,y,r,w)) return 1;
  return 0;
}
function wallHit(x,y,r,w){
  const dx=Math.cos(w.ang),dy=Math.sin(w.ang),h=w.len/2;
  const t=C((x-w.x)*dx+(y-w.y)*dy,-h,h);
  return D({x,y},{x:w.x+dx*t,y:w.y+dy*t})<r+w.thick/2;
}
function cam(){return{x:C(player.x-VIEW.w/2,0,WORLD.w-VIEW.w),y:C(player.y-VIEW.h/2,0,WORLD.h-VIEW.h)}}
function s2w(sx,sy){const c=cam();return{x:sx+c.x,y:sy+c.y}}
function w2s(x,y){const c=cam();return{x:x-c.x,y:y-c.y}}

// ── UPDATE ──
function updPlayer(dt){
  if(!player.alive)return;
  if(player.dash){
    player.dashT-=dt;
    const nx=player.x+player.dashV.x*dt,ny=player.y+player.dashV.y*dt;
    if(!blocked(nx,player.y,player.r))player.x=C(nx,player.r,WORLD.w-player.r);
    if(!blocked(player.x,ny,player.r))player.y=C(ny,player.r,WORLD.h-player.r);
    if(player.dashT<=0)player.dash=0;
  }else{
    let dx=0,dy=0;
    if(keys['w'])dy--;if(keys['s'])dy++;if(keys['a'])dx--;if(keys['d'])dx++;
    if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l}
    let sp=player.spd; if(elapsed<player.boost)sp*=1.55; if(elapsed<player.overload)sp*=1.2;
    const run=keys['shift']&&player.stam>4&&(dx||dy);
    if(run){sp*=1.5;player.stam=Math.max(0,player.stam-dt*32)}else player.stam=Math.min(player.maxStam,player.stam+dt*18);
    const nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;
    if(!blocked(nx,player.y,player.r))player.x=C(nx,player.r,WORLD.w-player.r);
    if(!blocked(player.x,ny,player.r))player.y=C(ny,player.r,WORLD.h-player.r);
  }
  if(CLASSES[cfg.cls].regen) player.hp=Math.min(player.maxHp,player.hp+CLASSES[cfg.cls].regen*dt);

  if(player.fireT>0)player.fireT-=dt;
  let rate=WEAPONS[player.weapon].rate;
  if(elapsed<player.overload)rate*=.45;
  if(mouse.down&&player.fireT<=0){fire(player,1);player.fireT=rate}

  if(player.reload){player.reloadT-=dt;if(player.reloadT<=0){player.reload=0;player.ammo[player.weapon]=WEAPONS[player.weapon].ammo}}
  if(D(player,zone)>zone.r){player.hp-=5*dt;if(player.hp<=0){player.alive=0;endGame(0)}}
  if(player.flash>0)player.flash-=dt;
  if(player.abCd>0)player.abCd-=dt;
  if(player.dashCd>0)player.dashCd-=dt;
  if(player.shake>0)player.shake-=dt;
  if(wallCd>0)wallCd-=dt;
  if(muzzleFlash>0)muzzleFlash-=dt;
  if(streakTimer>0){streakTimer-=dt;if(streakTimer<=0)killStreak=0}
}

function updBots(dt){
  for(const b of bots){
    if(!b.alive)continue;
    if(b.flash>0)b.flash-=dt;
    const dp=player.alive?D(b,player):9999;
    const see=dp<520&&player.alive&&elapsed>=player.phase;
    let tgt;
    if(see){
      if(dp<150)tgt={x:b.x-(player.x-b.x)*.6,y:b.y-(player.y-b.y)*.6};
      else if(dp>280)tgt=player;
      else tgt={x:b.x+R(-40,40),y:b.y+R(-40,40)};
      b.aim=Math.atan2(player.y-b.y,player.x-b.x)+R(-b.acc,b.acc);
      b.fireT-=dt;
      if(b.fireT<=0){fire(b,0);b.fireT=WEAPONS[b.weapon].rate*R(1,1.4)}
    }else{
      if(D(b,b.roam)<40)b.roam={x:R(80,WORLD.w-80),y:R(80,WORLD.h-80)};
      tgt=b.roam;
    }
    if(D(b,zone)>zone.r*.9)tgt=zone;
    const a=Math.atan2(tgt.y-b.y,tgt.x-b.x),nx=b.x+Math.cos(a)*b.spd*dt,ny=b.y+Math.sin(a)*b.spd*dt;
    if(!blocked(nx,b.y,b.r))b.x=C(nx,b.r,WORLD.w-b.r);
    if(!blocked(b.x,ny,b.r))b.y=C(ny,b.r,WORLD.h-b.r);
    if(D(b,zone)>zone.r){b.hp-=5*dt;if(b.hp<=0){b.alive=0;msg('☠ '+b.name+' — tormenta toxica')}}
  }
}

function updBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();
    b.x+=b.dx*dt;b.y+=b.dy*dt;b.life-=dt;
    let dead=b.life<=0;
    if(!dead){for(const o of obs)if(D(b,o)<o.r){dead=1;break}}
    if(!dead){for(const w of walls)if(wallHit(b.x,b.y,3,w)){w.hp-=22;dead=1;if(w.hp<=0&&!w.static)walls.splice(walls.indexOf(w),1);break}}
    if(!dead){
      if(b.owner==='p'){for(const bot of bots)if(bot.alive&&D(b,bot)<bot.r){hit(bot,b.dmg,1);if(!b.pierce)dead=1;else b.dmg*=.6;if(dead)break}}
      else if(player.alive&&D(b,player)<player.r) hit(player,b.dmg,0), dead=1;
    }
    if(!dead&&b.exp){boom(b.x,b.y,b.blast,b.dmg,b.owner);dead=1}
    if(dead)bullets.splice(i,1);
  }
}

function updGrenades(dt){
  for(let i=grenades.length-1;i>=0;i--){
    const g=grenades[i];g.vx*=.97;g.vy*=.97;g.x+=g.vx*dt;g.y+=g.vy*dt;g.t-=dt;
    if(g.t<=0){boom(g.x,g.y,110,60,g.owner);grenades.splice(i,1)}
  }
}

function updDrones(dt){
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];d.life-=dt;if(d.life<=0){drones.splice(i,1);continue}
    d.x=player.x+R(-60,60);d.y=player.y-40;
    let near=null,nd=9999;
    for(const b of bots)if(b.alive){const dd=D(d,b);if(dd<nd&&dd<450){nd=dd;near=b}}
    if(near){d.fireT-=dt;if(d.fireT<=0){const a=Math.atan2(near.y-d.y,near.x-d.x);
      bullets.push({x:d.x,y:d.y,dx:Math.cos(a)*800,dy:Math.sin(a)*800,dmg:14,life:1,owner:'drone',color:'#00f0ff',trail:[]});d.fireT=.3}}
  }
}

function updDrops(dt){
  for(const d of drops){if(!d.landed){d.fy+=dt*500;if(d.fy>=d.y){d.fy=d.y;d.landed=1;msg('📦 Suministro aterrizado')}}d.beam+=dt*4}
  if(Math.floor(elapsed/40)>Math.floor((elapsed-dt)/40)&&!gameOver){
    drops.push({x:R(200,WORLD.w-200),y:R(200,WORLD.h-200),fy:0,landed:0,open:0,loot:mkChest().loot,beam:0});
    msg('📦 Suministro aéreo entrante');
  }
}

function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.dx*dt;p.y+=p.dy*dt;if(p.life<=0)parts.splice(i,1)}}

function updZone(dt){
  const zI=cfg.mode==='blitz'?11:18;
  zone.next-=dt;
  if(!zone.shrink&&zone.next<=0&&zone.r>130){
    zone.shrink=1;zone.shT=7;zone.sR=zone.r;zone.tR=Math.max(130,zone.r*.55);
    zone.sCx=zone.cx;zone.sCy=zone.cy;
    zone.tCx=C(zone.cx+R(-300,300),zone.tR+50,WORLD.w-zone.tR-50);
    zone.tCy=C(zone.cy+R(-300,300),zone.tR+50,WORLD.h-zone.tR-50);
    msg('⚠ TORMENTA TÓXICA — La zona se contrae');
  }
  if(zone.shrink){
    zone.shT-=dt;const t=C(1-zone.shT/7,0,1);
    zone.r=zone.sR+(zone.tR-zone.sR)*t;zone.cx=zone.sCx+(zone.tCx-zone.sCx)*t;zone.cy=zone.sCy+(zone.tCy-zone.sCy)*t;
    if(t>=1){zone.shrink=0;zone.next=zI}
  }
}

// ── RENDER ──
function draw(){
  const m=MAPS[cfg.map], c=cam();
  let sx=0,sy=0;if(player.shake>0){sx=R(-5,5)*player.shake*12;sy=R(-5,5)*player.shake*12}
  ctx.save();ctx.translate(sx,sy);

  // BG
  ctx.fillStyle=m.bg;ctx.fillRect(0,0,VIEW.w,VIEW.h);
  const g=50;
  ctx.strokeStyle=m.grid;ctx.lineWidth=1;
  for(let x=-(c.x%g);x<VIEW.w;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,VIEW.h);ctx.stroke()}
  for(let y=-(c.y%g);y<VIEW.h;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VIEW.w,y);ctx.stroke()}

  // Drop pod anim
  if(dropAnim>0){
    dropAnim-=1/60;
    const ps=w2s(player.x,player.y-dropAnim*200);
    ctx.strokeStyle='#00f0ff88';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(ps.x,ps.y-100);ctx.lineTo(ps.x,ps.y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#00f0ff44';ctx.beginPath();ctx.arc(ps.x,ps.y,20+dropAnim*10,0,Math.PI*2);ctx.fill();
  }

  // Toxic storm zone
  const zs=w2s(zone.cx,zone.cy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,VIEW.w,VIEW.h);ctx.arc(zs.x,zs.y,zone.r,0,Math.PI*2,true);
  const grd=ctx.createRadialGradient(zs.x,zs.y,zone.r*.5,zs.x,zs.y,zone.r*1.5);
  grd.addColorStop(0,'rgba(255,45,149,.15)');grd.addColorStop(1,'rgba(80,0,40,.55)');
  ctx.fillStyle=grd;ctx.fill('evenodd');ctx.restore();
  ctx.beginPath();ctx.arc(zs.x,zs.y,zone.r,0,Math.PI*2);
  ctx.strokeStyle=m.accent;ctx.lineWidth=3;ctx.shadowColor=m.accent;ctx.shadowBlur=15+Math.sin(elapsed*3)*5;ctx.stroke();ctx.shadowBlur=0;

  // Obstacles
  for(const o of obs){const s=w2s(o.x,o.y);if(s.x<-60||s.x>VIEW.w+60)continue;
    ctx.beginPath();ctx.arc(s.x,s.y,o.r,0,Math.PI*2);
    const cols={rock:'#3a3a50',tree:'#1a4030',ruin:'#2a2840',crate:'#4a3820'};
    ctx.fillStyle=cols[o.t]||'#333';ctx.fill();
    ctx.strokeStyle=m.accent+'44';ctx.lineWidth=1;ctx.stroke()}

  // Chests with beam
  document.getElementById('hint').style.display='none';
  for(const ch of chests){
    if(ch.open)continue; const s=w2s(ch.x,ch.y);if(s.x<-50||s.x>VIEW.w+50)continue;
    ch.r+=.04;
    const col=ch.tier==='LEGENDARIO'?'#ff1744':ch.tier==='ÉPICO'?'#b388ff':ch.tier==='RARO'?'#ffe600':'#00f0ff';
    ctx.shadowColor=col;ctx.shadowBlur=12+Math.sin(ch.r)*6;
    ctx.fillStyle=col+'88';ctx.fillRect(s.x-15,s.y-12,30,22);
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(s.x-15,s.y-12,30,22);
    ctx.shadowBlur=0;
    // beam
    ctx.globalAlpha=.15;ctx.fillStyle=col;ctx.fillRect(s.x-2,s.y-80,4,68);ctx.globalAlpha=1;
    if(D(ch,player)<50) document.getElementById('hint').style.display='block';
  }

  // Supply drops
  for(const d of drops){
    const sy=d.landed?d.y:d.fy,s=w2s(d.x,sy);
    ctx.fillStyle='#00f0ff';ctx.fillRect(s.x-14,s.y-18,28,20);
    if(d.landed&&!d.open){ctx.globalAlpha=.2+Math.sin(d.beam)*.1;ctx.fillStyle='#00f0ff';ctx.fillRect(s.x-3,s.y-70,6,52);ctx.globalAlpha=1;
      if(D(d,player)<50)document.getElementById('hint').style.display='block'}
  }

  // Walls
  for(const w of walls){const s=w2s(w.x,w.y);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(w.ang+Math.PI/2);
    ctx.fillStyle=w.static?'#2a2a40':'#5a4030';ctx.fillRect(-w.len/2,-w.thick/2,w.len,w.thick);
    ctx.strokeStyle='#00f0ff33';ctx.strokeRect(-w.len/2,-w.thick/2,w.len,w.thick);ctx.restore()}

  // Grenades
  for(const g of grenades){const s=w2s(g.x,g.y);ctx.fillStyle='#ff1744';ctx.shadowColor='#ff1744';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(s.x,s.y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}

  // Bullets with trails
  for(const b of bullets){
    const s=w2s(b.x,b.y);
    if(b.trail.length>1){ctx.strokeStyle=b.color+'66';ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<b.trail.length;i++){const ts=w2s(b.trail[i].x,b.trail[i].y);i?ctx.lineTo(ts.x,ts.y):ctx.moveTo(ts.x,ts.y)}ctx.stroke()}
    ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}

  // Drones
  for(const d of drones){const s=w2s(d.x,d.y);ctx.fillStyle='#00f0ff';ctx.shadowColor='#00f0ff';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}

  // Bots
  for(const b of bots) if(b.alive) drawChar(b,'#ff2d95',0);
  // Player
  if(player.alive){
    if(elapsed<player.phase){ctx.globalAlpha=.3}
    drawChar(player,'#00f0ff',1);
    ctx.globalAlpha=1;
    if(muzzleFlash>0){const s=w2s(player.x,player.y);ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=20;
      ctx.beginPath();ctx.arc(s.x+Math.cos(player.facing)*22,s.y+Math.sin(player.facing)*22,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
  }

  // Particles
  for(const p of parts){const s=w2s(p.x,p.y);ctx.globalAlpha=C(p.life/.5,0,1);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(s.x,s.y,p.sz,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

  ctx.restore();
  drawMM(m);
}

function drawChar(e,col,isP){
  const s=w2s(e.x,e.y);
  // shadow
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(s.x,s.y+e.r*.8,e.r,e.r*.35,0,0,Math.PI*2);ctx.fill();
  // shield
  if(isP&&elapsed<e.shield){ctx.beginPath();ctx.arc(s.x,s.y,e.r+10,0,Math.PI*2);ctx.strokeStyle='#39ff14';ctx.lineWidth=2;ctx.shadowColor='#39ff14';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0}
  // body
  ctx.beginPath();ctx.arc(s.x,s.y,e.r,0,Math.PI*2);
  ctx.fillStyle=e.flash>0?'#fff':col;ctx.fill();
  ctx.strokeStyle='#000a';ctx.lineWidth=2;ctx.stroke();
  // gun arm
  const a=isP?e.facing:(e.aim||0);
  ctx.strokeStyle=isP?'#00f0ff':'#ff2d95';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+Math.cos(a)*e.r*2,s.y+Math.sin(a)*e.r*2);ctx.stroke();
  // gun tip glow
  ctx.fillStyle=isP?'#00f0ff':'#ff2d95';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(s.x+Math.cos(a)*e.r*2,s.y+Math.sin(a)*e.r*2,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  // hp
  ctx.fillStyle='#000a';ctx.fillRect(s.x-18,s.y-e.r-12,36,4);
  ctx.fillStyle=isP?'#39ff14':'#ff2d95';ctx.fillRect(s.x-18,s.y-e.r-12,36*C(e.hp/e.maxHp,0,1),4);
  if(!isP){ctx.fillStyle='#6a7a9a';ctx.font='9px Rajdhani';ctx.textAlign='center';ctx.fillText(e.name,s.x,s.y-e.r-16)}
}

function drawMM(m){
  const sc=Math.min(mmC.width/WORLD.w,mmC.height/WORLD.h);
  mmX.fillStyle='#000c';mmX.fillRect(0,0,mmC.width,mmC.height);
  mmX.strokeStyle=m.accent+'66';mmX.beginPath();mmX.arc(zone.cx*sc,zone.cy*sc,zone.r*sc,0,Math.PI*2);mmX.stroke();
  mmX.fillStyle='#00f0ff';mmX.beginPath();mmX.arc(player.x*sc,player.y*sc,4,0,Math.PI*2);mmX.fill();
  mmX.fillStyle='#ff2d95';for(const b of bots)if(b.alive){mmX.beginPath();mmX.arc(b.x*sc,b.y*sc,2.5,0,Math.PI*2);mmX.fill()}
  mmX.fillStyle='#ffe600';for(const c of chests)if(!c.open){mmX.fillRect(c.x*sc-2,c.y*sc-2,4,4)}
}

function updHUD(){
  document.getElementById('hpF').style.width=C(player.hp/player.maxHp*100,0,100)+'%';
  document.getElementById('stF').style.width=C(player.stam/player.maxStam*100,0,100)+'%';
  const w=WEAPONS[player.weapon];
  document.getElementById('wName').textContent=w.name;
  document.getElementById('wTier').textContent=w.tier;
  document.getElementById('wAmmo').textContent=w.melee?'CUERPO A CUERPO':player.reload?'RECARGANDO...':(player.ammo[player.weapon]||0)+' / '+w.ammo;
  document.getElementById('zoneT').textContent=Math.max(0,Math.ceil(zone.shrink?zone.shT:zone.next));
  document.getElementById('aliveT').textContent=1+bots.filter(b=>b.alive).length;
  const mt=Math.floor(elapsed);document.getElementById('timeT').textContent=Math.floor(mt/60)+':'+(mt%60+'').padStart(2,'0');
  updCD('cdQ',player.abCd,CLASSES[cfg.cls].cd,'abQ');
  updCD('cdF',player.dashCd,2.2,'abF');
  const gEl=document.getElementById('cdG');gEl.classList.toggle('hidden',player.grenades>0);
  gEl.textContent=player.grenades;document.getElementById('abG').classList.toggle('ok',player.grenades>0);
  buildSlots();
}
function updCD(id,cd,max,ab){const el=document.getElementById(id),abEl=document.getElementById(ab);
  if(cd>0){el.classList.remove('hidden');el.textContent=Math.ceil(cd);abEl.classList.remove('ok')}
  else{el.classList.add('hidden');abEl.classList.add('ok')}}

// ── LOOP ──
function loop(ts){
  if(!running)return;
  const dt=C((ts-lastT)/1000||0,0,.05);lastT=ts;
  if(!paused&&!gameOver){
    elapsed+=dt;
    updPlayer(dt);updBots(dt);updBullets(dt);updGrenades(dt);updDrones(dt);updDrops(dt);updParts(dt);updZone(dt);
    if(!bots.some(b=>b.alive)&&player.alive)endGame(1);
  }
  draw();updHUD();
  requestAnimationFrame(loop);
}

function endGame(won){
  gameOver=1;running=0;sfx(won?'win':'hit');
  try{const lb=JSON.parse(localStorage.getItem('neonPurga')||'[]');let e=lb.find(x=>x.n===cfg.name);
    if(!e){e={n:cfg.name,w:0,k:0,d:0};lb.push(e)}if(won)e.w++;e.k+=stats.k;e.d+=Math.round(stats.dmg);
    lb.sort((a,b)=>b.w-a.w);localStorage.setItem('neonPurga',JSON.stringify(lb.slice(0,30)))}catch(e){}
  document.getElementById('resTitle').textContent=won?'◈ PURGA COMPLETADA':'◈ OPERATIVO CAÍDO';
  document.getElementById('resSub').textContent=won?'Eres el último superviviente del sector.':'La tormenta tóxica te consumió.';
  document.getElementById('rK').textContent=stats.k;
  document.getElementById('rD').textContent=Math.round(stats.dmg);
  const mt=Math.floor(elapsed);document.getElementById('rT').textContent=Math.floor(mt/60)+':'+(mt%60+'').padStart(2,'0');
  showUI('results');
}

function startMatch(){
  cfg.name=(document.getElementById('pName').value||'Neon-7').trim().slice(0,16);
  cfg.diff=document.getElementById('diff').value;
  cfg.mode=document.getElementById('mode').value;
  initAudio();resetWorld();showUI('game');running=0;mouse.down=0;
  const cd=document.getElementById('countdown');let n=3;cd.classList.remove('hidden');cd.textContent=n;
  const iv=setInterval(()=>{n--;if(n>0)cd.textContent=n;else{clearInterval(iv);cd.classList.add('hidden');running=1;lastT=performance.now();requestAnimationFrame(loop)}},600);
}

function showRank(){
  const lb=JSON.parse(localStorage.getItem('neonPurga')||'[]').slice(0,10);
  document.getElementById('rankList').innerHTML=lb.length?lb.map((e,i)=>`<div>${i+1}. <b style="color:var(--neon-c)">${e.n}</b> — ${e.w} victorias · ${e.k} kills</div>`).join(''):'<div style="color:var(--muted)">Sin datos</div>';
  showUI('rank');
}

// Menu bg particles
(function menuBg(){
  const mc=document.getElementById('menuCanvas');mc.width=innerWidth;mc.height=innerHeight;
  const mx=mc.getContext('2d');const pts=[];
  for(let i=0;i<80;i++)pts.push({x:R(0,mc.width),y:R(0,mc.height),s:R(.5,2),v:R(1,3)});
  function anim(){
    mx.fillStyle='#04040c';mx.fillRect(0,0,mc.width,mc.height);
    for(const p of pts){p.y-=p.v;if(p.y<0){p.y=mc.height;p.x=R(0,mc.width)}
      mx.fillStyle=`rgba(0,240,255,${p.s/3})`;mx.fillRect(p.x,p.y,p.s,p.s*4)}
    requestAnimationFrame(anim);
  }anim();
})();

// Events
document.getElementById('bQuick').onclick=()=>{buildLobby();startMatch()};
document.getElementById('bLobby').onclick=()=>{buildLobby();showUI('lobby')};
document.getElementById('bRank').onclick=showRank;
document.getElementById('bBack').onclick=()=>showUI('menu');
document.getElementById('bBackRank').onclick=()=>showUI('menu');
document.getElementById('bStart').onclick=startMatch;
document.getElementById('bResume').onclick=()=>{paused=0;showUI('game');lastT=performance.now()};
document.getElementById('bQuit').onclick=()=>{running=0;showUI('menu')};
document.getElementById('bAgain').onclick=()=>{buildLobby();showUI('lobby')};
document.getElementById('bMenu').onclick=()=>{running=0;showUI('menu')};

buildLobby();showUI('menu');
})();
</script>
